[project]
name = "parallel-llm-inference"
version = "0.1.0"
description = "Pipeline-parallel inference for a small language model, split across two machines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pllm"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
