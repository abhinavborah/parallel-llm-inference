# Address and port of every process. Every process reads this file; none hard-codes an address.
# The defaults run all processes on one laptop. For a LAN run, copy this file to
# config/hosts.local.toml (ignored by git), set each host to that laptop's IP, and point
# PLLM_CONFIG at the copy.

# Name of the network in use, written to every run record.
network = "single-host"

[gateway]
host = "127.0.0.1"
port = 50050

[stage0]
host = "127.0.0.1"
port = 50051

[stage1]
host = "127.0.0.1"
port = 50052

# Where each laptop's supervisor takes kill, suspend and resume requests (optional; without
# these tables a supervisor listens on its stage's host at port 50061 or 50062).
[supervisor0]
host = "127.0.0.1"
port = 50061

[supervisor1]
host = "127.0.0.1"
port = 50062

# Where the gateway serves the dashboard when it is started with --dashboard (optional; without
# this table it listens on the gateway's host at port 50080). The host is the address the browser
# types, not 0.0.0.0. The page can kill, freeze and unfreeze workers and has no authentication: use a trusted network.
[dashboard]
host = "127.0.0.1"
port = 50080

# Bounds on the largest gRPC message, a prefill of max_batch x max_prompt_tokens positions of
# hidden-size fp32 values (decision #20). Every server and channel sets its receive limit from
# these, and the gateway rejects a prompt above max_prompt_tokens. Prefill is not batched
# (decision #41), so max_batch is 1.
[limits]
max_batch = 1
max_prompt_tokens = 512
# Flow control (R5.1, R5.2). admission_queue: requests that may wait at the gateway for a
# running slot; one more is refused with RESOURCE_EXHAUSTED (0 refuses as soon as the
# running slots are full). credits: steps in flight in the pipeline at once; a running
# request has at most one, so this binds only below the gateway's 14 running slots.
# stage_inbox: messages a stage holds waiting; at least credits, so it does not fill while
# the gateway keeps to its credits.
admission_queue = 8
credits = 8
stage_inbox = 16
# Memory-aware admission (R5.3). Host B runs Stage 0 with a worker budget of 0.7 GiB peak RSS
# for the whole process (R1.7, agreed 2026-11-25). The runtime is the RSS of a fresh process
# after importing torch and the model code, measured on Host B (194 to 196 MiB, 2026-11-07 and
# 2026-11-09). The margin is a proposed figure, not a measurement, kept inside the budget for
# what runtime plus weights leave out: a serving Stage 0 for SmolLM2 read about 415 MiB idle,
# about 16 MiB above them (a check on Host B on 2026-11-26, not a recorded run); one appended
# layer (about 12 MiB at 8,192 positions); attention scores of a 512 token prefill (about
# 18 MiB); gRPC message copies (a few MiB). The gateway subtracts the runtime, the margin and
# the Stage 0 weights (computed from the model file) and admits a request only while the KV
# caches it has admitted fit what is left.
host_b_budget_gib = 0.7
host_b_runtime_mib = 196
host_b_margin_mib = 64

# Split point k per model: stage 0 runs layers 0 to k - 1, stage 1 runs k to the last layer.
# Always read from this committed file, never from a local copy, so both laptops use the
# same k. The values are the even splits; the capacity-aware split replaces them.
[split]
"smollm2-135m" = 15
"qwen3-0.6b" = 14
